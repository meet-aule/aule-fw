version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: "ci(actions)"
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    commit-message:
      prefix: "build(firmware-builder)"
    directory: /docker/firmware-builder
    schedule:
      interval: weekly
  - package-ecosystem: pip
    commit-message:
      prefix: "chore(tool-deps)"
    directories:
      - /scripts/Image_Converter
      - /scripts/p3_tools
    schedule:
      interval: weekly
    groups:
      tool-compatible:
        update-types: [minor, patch]
