name: Aule release

# Releases a version once its release PR changes PROJECT_VER on the default branch: it builds
# the commit that set the version, tags it aule-v<version> and publishes a GitHub Release whose
# body is that version's CHANGELOG.md section, with the Aule board's firmware attached. See
# RELEASING.md. Upstream's release.yml is xiaozhi's full-matrix release, and upstream already
# uses v<version> tags.
on:
  push:
    branches: [aule]
    paths: [CMakeLists.txt]
  # To retry a failed run. A version that already has its tag is left alone.
  workflow_dispatch:

permissions: {}

# One release at a time, and never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the version
    # Only the canonical repository's default branch releases: never a fork or another branch.
    if: github.repository == 'meet-aule/aule-fw' && github.ref == 'refs/heads/aule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tagged: ${{ steps.version.outputs.tagged }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, to find the commit that set the version. In a shallow clone,
          # git log would name the newest commit instead.
          fetch-depth: 0
      - name: Check the version and changelog
        run: python3 scripts/version.py check
      - name: Look for the version's tag and commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/version.py current)
          tag="aule-v$version"
          # matching-refs lists every tag that starts with the name, so compare whole refs.
          count=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq "map(select(.ref == \"refs/tags/$tag\")) | length")
          if [[ "$count" == 0 ]]; then tagged=false; else tagged=true; fi
          echo "$tag already tagged: $tagged"
          # The last commit that changed the marked version line: the release PR's merge. A
          # retry, or a run that starts after other merges, still builds and tags that commit,
          # not the newest one. Upstream's own version bumps have no marker.
          commit=$(git log -1 --format=%H -G'PROJECT_VER.*x-aule-version' -- CMakeLists.txt)
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::No commit changed the x-aule-version line of CMakeLists.txt."
            exit 1
          fi
          echo "$version was set by $commit"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "tagged=$tagged"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build aule-v0.2
    needs: prepare
    if: needs.prepare.outputs.tagged == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Building runs third-party code, so it happens in a job that cannot publish.
    permissions:
      contents: read
    container:
      image: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      # The same build as firmware.yml's, of the commit that set the version, which the
      # firmware then reports.
      - name: Build
        shell: bash
        env:
          AULE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py aule/aule-v0.2 --language es-ES
      - name: Package and verify the USB and OTA images
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python scripts/package_aule.py --version "$VERSION"
          cat release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  release:
    name: Tag and publish
    needs: [prepare, build]
    if: github.repository == 'meet-aule/aule-fw' && needs.prepare.outputs.tagged == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # No third-party release action: the gh CLI creates the tag on the commit that set the
      # version together with the release, using this job's GITHUB_TOKEN.
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python3 scripts/version.py section "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "release/aule-v0.2-$VERSION.bin" "release/aule-v0.2-$VERSION.ota.bin" release/SHA256SUMS
