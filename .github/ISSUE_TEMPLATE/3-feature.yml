name: Feature request
description: Suggest something the device should do.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What should a child, parent or teacher be able to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it working
  - type: checkboxes
    id: kids
    attributes:
      label: Children first
      options:
        - label: This keeps the hardware microphone mute and does not record or send more than it needs.
          required: true
